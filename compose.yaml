services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bac2027
      POSTGRES_USER: bac2027
      POSTGRES_PASSWORD: bac2027_dev
    ports:
      - "5432:5432"
    volumes:
      - bac2027_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bac2027 -d bac2027"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bac2027_postgres_data:
